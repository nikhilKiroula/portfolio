<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive viewport configuration. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO title. -->
    <title>Nikhil Singh Kiroula | Full Stack Developer</title>

    <!-- Search engine description. -->
    <meta
      name="description"
      content="Portfolio of Nikhil Singh Kiroula, a Full Stack Developer building modern web applications with React, TypeScript, Node.js, MongoDB, and AI."
    />

    <!-- Search engine keywords. -->
    <meta
      name="keywords"
      content="Nikhil Singh Kiroula, Full Stack Developer, MERN Stack Developer, React Developer, TypeScript Developer, Node.js Developer, Web Developer"
    />

    <!-- Tell search engines who the content belongs to. -->
    <meta name="author" content="Nikhil Singh Kiroula" />

    <!-- Browser theme color. -->
    <meta name="theme-color" content="#050507" />

    <!-- Search engine crawling instructions. -->
    <meta name="robots" content="index, follow" />

    <!-- Preferred URL for search engines. -->
    <link
      rel="canonical"
      href="https://portfolio-ruddy-seven-59.vercel.app/"
    />

    <!-- Open Graph metadata for social sharing. -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Nikhil Singh Kiroula | Full Stack Developer"
    />

    <meta
      property="og:description"
      content="Full Stack Developer building modern web experiences with React, TypeScript, Node.js, MongoDB, and AI."
    />

    <meta
      property="og:url"
      content="https://portfolio-ruddy-seven-59.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://portfolio-ruddy-seven-59.vercel.app/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Nikhil Singh Kiroula — Full Stack Developer"
    />

    <!-- Twitter/X sharing metadata. -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Nikhil Singh Kiroula | Full Stack Developer"
    />

    <meta
      name="twitter:description"
      content="Full Stack Developer building modern web experiences with React, TypeScript, Node.js, MongoDB, and AI."
    />

    <meta
      name="twitter:image"
      content="https://portfolio-ruddy-seven-59.vercel.app/og-image.png"
    />

    <!-- Favicon. -->
    <link
      rel="icon"
      type="image/png"
      href="/favicon.png"
    />

    <!-- Preconnect to Google Fonts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <!-- Application fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
